spring.application.name=equipos

# Base de datos H2 en memoria: los datos se pierden al reiniciar la app.
spring.datasource.url=jdbc:h2:mem:equiposdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

server.port=8082

# La consola de H2 NO esta activa por defecto. Para activarla usa el perfil "dev"
# (ver application-dev.properties):
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=dev"
#   java -jar target\equipos-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev
