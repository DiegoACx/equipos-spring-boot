# Perfil "dev": solo para desarrollo local. No lo actives en un servidor ni en Docker
# expuesto: la consola de H2 no tiene autenticacion propia.
#
# Como activarlo:
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=dev"
#   $env:SPRING_PROFILES_ACTIVE = "dev"; .\mvnw.cmd spring-boot:run
#   java -jar target\equipos-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev
#
# Consola: http://localhost:8082/h2-console
#   JDBC URL: jdbc:h2:mem:equiposdb   Usuario: sa   Contrasena: (vacia)
spring.h2.console.enabled=true
