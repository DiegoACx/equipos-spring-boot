<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(135deg, #6d4c41, #3e2723); /* Fondo marrón oscuro */
            font-family: 'Arial', sans-serif;
            color: #f5f5f5;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(102, 51, 0, 0.3); /* sombra marrón */
            overflow: hidden;
        }

        .card-header {
            background-color: #5d4037; /* Marrón medio */
            color: white;
            text-align: center;
            padding: 1rem;
        }

        .card-body {
            background-color: #ffffff;
            padding: 2rem;
            color: #3e2723; /* Marrón oscuro para el texto */
        }

        .table th, .table td {
            vertical-align: middle;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #d7ccc8; /* Marrón claro */
        }

        .table-hover tbody tr:hover {
            background-color: #a1887f; /* Marrón más claro */
        }

        .btn-primary, .btn-danger, .btn-secondary {
            border-radius: 5px;
            display: flex;
            align-items: center;
            font-weight: bold;
            color: white;
        }

        .btn-primary {
            background-color: #795548; /* Marrón */
            border-color: #6d4c41;
        }

        .btn-primary:hover {
            background-color: #5d4037;
        }

        .btn-danger {
            background-color: #a1887f; /* Marrón más claro */
            border-color: #8d6e63;
        }

        .btn-danger:hover {
            background-color: #6d4c41;
        }

        .btn-secondary {
            background-color: #3e2723; /* Marrón oscuro */
            border-color: #3e2723;
        }

        .btn-secondary:hover {
            background-color: #2e1f1b;
        }

        .btn-primary i, .btn-danger i, .btn-secondary i {
            margin-right: 5px;
        }

        .card-footer {
            background-color: #5d4037;
            text-align: right;
            padding: 1rem;
        }

        .btn-light {
            background-color: #d7ccc8; /* Marrón claro */
            border-color: #d7ccc8;
            color: #3e2723;
        }

        .btn-light:hover {
            background-color: #bcaaa4;
        }

        /* Personalización para el encabezado de la tabla */
        .table thead.thead-dark th {
            background-color: #4e342e; /* Marrón oscuro */
            color: #ffffff;
            border-color: #3e2723;
        }

        /* Estilos para los botones en el cuerpo principal */
        .btn-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn-custom {
            border-radius: 10px;
            font-size: 1.2rem;
            padding: 0.8rem 2rem;
        }

        .btn-register {
            background-color: #795548; /* Marrón */
            border-color: #6d4c41;
        }

        .btn-register:hover {
            background-color: #5d4037;
        }

        .btn-show {
            background-color: #3e2723; /* Marrón oscuro */
            border-color: #3e2723;
        }

        .btn-show:hover {
            background-color: #2e1f1b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bienvenido al sistema de registro de equipos</h1>
        <div class="btn-row">
            <a href="/verequipo/formequipo" class="btn btn-custom btn-register">
                <i class="fas fa-plus-circle"></i> Registrar un nuevo equipo
            </a>
            <a href="/verequipo" class="btn btn-custom btn-show">
                <i class="fas fa-eye"></i> Ver equipos registrados
            </a>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
</body>
</html>
